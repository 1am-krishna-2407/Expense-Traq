# Netlify alternative to vercel.json (Plan §28). Proxying /api keeps the refresh cookie
# first-party, so SameSite=Strict keeps working in production.
[build]
  command = "npm run build"
  publish = "dist"

[[redirects]]
  from = "/api/*"
  to = "https://rupeeflow-api.onrender.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
