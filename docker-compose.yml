services:
  postgres:
    image: postgres:16-alpine
    container_name: rupeeflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: rupeeflow
      POSTGRES_PASSWORD: rupeeflow
      POSTGRES_DB: rupeeflow
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Creates the separate test database used by the backend Jest suite
      - ./backend/prisma/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rupeeflow"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
